<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>飞机电源系统测试报告</title>

    <style>
        body {
            width: 1000px;
            margin: auto;
            font-family: Arial;
            line-height: 1.8;
        }

        h1 {
            text-align: center;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        .section {
            margin-top: 50px;
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #ddd;
            text-decoration: none;
            border-radius: 5px;
            color: black;
        }

        iframe {
            border: 1px solid #ccc;
        }
    </style>

</head>

<body>

    <h1>飞机电源系统第三方测试结果展示</h1>

    <p>
        本页面用于展示飞机电源系统相关测试资料，
        包括测试图片、第三方测试报告以及频率指标数据，
        方便项目组成员进行统一浏览与分享。
    </p>

    <!-- 图片 -->
    <div class="section">

        <h2>1. 测试结果图片展示</h2>

        <p>
            下图展示了飞机电源系统测试过程中的关键结果截图。
        </p>

        <img src="image.png">

    </div>


    <!-- PDF -->
    <div class="section">

        <h2>2. 第三方测试报告</h2>

        <p>
            以下为第三方测试机构出具的正式测试报告，
            可在线预览。
        </p>

        <iframe
            src="report.pdf"
            width="100%"
            height="700">
        </iframe>

    </div>


    <!-- Excel -->
    <div class="section">

        <h2>3. 频率指标数据</h2>

        <p>
            原始频率指标数据保存在Excel表格中，
            点击下方按钮可下载查看。
        </p>

        <a 
            class="download-btn"
            href="data.xls"
            download>
            下载Excel数据
        </a>

    </div>


    <!-- 总结 -->
    <div class="section">

        <h2>4. 数据说明</h2>

        <p>
            本测试数据主要用于分析IDG系统运行状态、
            发电频率稳定性以及异常工况特征，
            后续将结合健康指标模型开展寿命预测研究。
        </p>

    </div>

</body>
</html>
